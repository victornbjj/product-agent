[project]
name = "produts-agents"
version = "0.1.0"
description = "projeto 1 trilha."
readme = "README.md"
authors = [
    { name = "João Victor Pereira do Nascimento", email = "victorifpb78@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "dotenv>=0.9.9",
    "fastapi>=0.165.0",
    "psycopg[binary]>=3.3.9",
    "sqlalchemy>=2.1.9",
    "uvicorn>=0.54.0",
]

[project.scripts]
produts-agents = "produts_agents:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
